name: Compilation Multi-Plateforme

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 1. Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: 2. Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Installer PyInstaller (nécessaire pour votre script)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: 4. Lancer votre script de build personnalisé
        # Ce step exécute directement VOTRE script script/build.py
        run: |
          python script/build.py

      - name: 5. Zipper l'application générée (Obligatoire pour les dossiers/bundles)
        shell: bash
        run: |
          # On crée le dossier final à la racine du projet
          mkdir -p binaires_finaux
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Votre script génère un dossier 'dist/GestionnaireCatalogue' sur Windows
            cd dist
            tar -acf ../binaires_finaux/GestionnaireCatalogue-Windows.zip GestionnaireCatalogue
          else
            # Votre script génère un bundle 'dist/GestionnaireCatalogue.app' sur Mac
            cd dist
            zip -r ../binaires_finaux/GestionnaireCatalogue-Mac.zip GestionnaireCatalogue.app
          fi

      - name: 6. Attacher les fichiers ZIP à la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          # On envoie le zip final créé à l'étape précédente
          files: binaires_finaux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
