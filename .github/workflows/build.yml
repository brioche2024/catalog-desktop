name: Compilation Multi-Plateforme

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 1. Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: 2. Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Installer PyInstaller (nécessaire pour votre script)
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools pillow
          pip install -r requirements-build.txt

      - name: 4. Lancer votre script de build personnalisé
        # Ce step exécute directement VOTRE script script/build.py
        run: |
          python scripts/build.py

      - name: 5. Zipper l'application générée (Obligatoire pour les dossiers/bundles)
        run: |
          # On s'assure que le dossier de sortie existe à la racine
          # Sur Windows, GitHub Actions utilise PowerShell par défaut, sur Mac c'est Bash
          if ("${{ matrix.os }}" -eq "windows-latest") {
              New-Item -ItemType Directory -Force -Path "binaires_finaux"
              if (Test-Path "dist/GestionnaireCatalogue") {
                  # Utilisation de la commande native PowerShell de Windows pour un ZIP parfait
                  Compress-Archive -Path "dist/GestionnaireCatalogue" -DestinationPath "binaires_finaux/GestionnaireCatalogue-Windows.zip" -Force
              } else {
                  Write-Error "Erreur : Dossier dist/GestionnaireCatalogue introuvable !"
                  exit 1
              }
          } else {
              mkdir -p binaires_finaux
              if [ -d "dist/GestionnaireCatalogue.app" ]; then
                  cd dist
                  zip -r ../binaires_finaux/GestionnaireCatalogue-Mac.zip GestionnaireCatalogue.app
              else
                  echo "Erreur : Application dist/GestionnaireCatalogue.app introuvable !"
                  exit 1
              fi
          }

      - name: 6. Attacher les fichiers ZIP à la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          # On envoie le zip final créé à l'étape précédente
          files: binaires_finaux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
