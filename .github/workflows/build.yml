name: Compilation Multi-Plateforme

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 1. Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: 2. Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Installer PyInstaller (nécessaire pour votre script)
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools pillow
          pip install -r requirements-build.txt

      # --- ÉTAPE 4 WINDOWS ---
      - name: 4a. [Windows] Lancer le script de build
        if: matrix.os == 'windows-latest'
        run: |
          python scripts/build.py
        shell: bash

      # --- ÉTAPE 4 MAC INTEL ---
      - name: 4b. [macOS Intel] Lancer le script de build
        if: matrix.os == 'macos-latest'
        run: |
          # On force PyInstaller à ne compiler que pour l'architecture Intel
          arch -x86_64 python scripts/build.py
        shell: bash

      # --- ÉTAPE 5a COMPRESSION WINDOWS ---
      - name: 5a. [Windows] Vérification et compression ZIP
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "binaires_finaux"
          if (Test-Path "dist/GestionnaireCatalogue") {
              Compress-Archive -Path "dist/GestionnaireCatalogue" -DestinationPath "binaires_finaux/GestionnaireCatalogue-Windows.zip" -Force
          } else {
              Write-Error "Erreur : Dossier dist/GestionnaireCatalogue introuvable !"
              exit 1
          }

      # --- ÉTAPE 5b COMPRESSION MAC INTEL & SILICON ---
      - name: 5b. [macOS] Extraction, Séparation et Compression
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p binaires_finaux
          cd dist
          
          if [ -d "GestionnaireCatalogue.app" ]; then
              # 1. On sauvegarde la version Intel qui vient d'être compilée
              zip -r ../binaires_finaux/GestionnaireCatalogue-Mac-Intel.zip GestionnaireCatalogue.app
              
              # 2. Nettoyage pour la deuxième compilation
              rm -rf GestionnaireCatalogue.app
              cd ..
              
              # 3. On relance la compilation mais cette fois forcée pour Apple Silicon (ARM64)
              arch -arm64 python scripts/build.py
              
              # 4. On compresse la version Silicon obtenue
              cd dist
              zip -r ../binaires_finaux/GestionnaireCatalogue-Mac-Silicon.zip GestionnaireCatalogue.app
          else
              echo "Erreur : Application dist/GestionnaireCatalogue.app introuvable !"
              exit 1
          fi

      - name: 6. Attacher les fichiers ZIP à la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          # On envoie le zip final créé à l'étape précédente
          files: binaires_finaux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
